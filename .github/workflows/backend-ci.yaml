name: Backend Continuous Integration

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: starter/backend
          push: false
          tags: mp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
