name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster
  MOVIE_API_URL: http://a0f798dea963442e89840530c2bfb196-1694132371.us-east-1.elb.amazonaws.com

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run tests
        working-directory: starter/frontend
        run: npm run test -- --watchAll=false

  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    environment: PROD

    needs:
      - lint
      - test

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "453722413028"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          push: true
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ env.MOVIE_API_URL }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Deploy frontend
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}"

          kubectl kustomize starter/frontend/k8s \
            | sed "s|image: frontend|image: ${IMAGE}|g" \
            | kubectl apply -f -

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            --timeout=180s

      - name: Verify frontend deployment
        run: |
          kubectl get deployment frontend
          kubectl get pods -l app=frontend
          kubectl get service frontend