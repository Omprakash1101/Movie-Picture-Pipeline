name: Setup Backend

description: Setup Python, Pipenv, restore pip cache, and install backend dependencies

runs:
  using: composite

  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: starter/backend/Pipfile.lock

    - name: Install Pipenv
      shell: bash
      run: python -m pip install pipenv

    - name: Install dependencies
      shell: bash
      working-directory: starter/backend
      run: pipenv install --dev
